name: CodeQL
on:
  push:
  pull_request:
  schedule:
    - cron: '30 2 * * 1'
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: php
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
